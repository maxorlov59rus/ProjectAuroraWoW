name: Windows Build CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install MySQL
      run: choco install mysql -y
    
    - name: Clone AzerothCore
      run: git clone --depth 1 https://github.com/azerothcore/azerothcore-wotlk.git ../azerothcore-wotlk
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'
    
    - name: Find Visual Studio
      id: vs
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vsPath) { throw "Visual Studio not found" }
        echo "vs_path=$vsPath" >> $env:GITHUB_OUTPUT
        echo "Found Visual Studio at: $vsPath"
    
    - name: Configure
      shell: powershell
      run: |
        cmake -S Aurora -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAZEROTHCORE_SOURCE_DIR="${{ github.workspace }}/../azerothcore-wotlk" -DCMAKE_GENERATOR_INSTANCE="${{ steps.vs.outputs.vs_path }}"
    
    - name: Build
      run: cmake --build build --config RelWithDebInfo --parallel 4
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aurora-server-build
        path: build/bin/RelWithDebInfo/